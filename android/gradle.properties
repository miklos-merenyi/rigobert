org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# flutter_soloud bundles Opus/Ogg/Vorbis/FLAC codec support by default; we
# only play MP3 assets (see lib/sound_player.dart), so skip it to save
# ~600KB-1.5MB per ABI. Only setBufferStream()/readSamplesFrom*() with
# those formats would be affected, and we don't use either.
NO_XIPH_LIBS=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
